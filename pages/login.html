<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UiTM e-Marketplace</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- UiTM Design System -->
    <link rel="stylesheet" href="../assets/css/uitm-glassmorphism.css">
    <link rel="stylesheet" href="../assets/css/uitm-animations.css">
    <link rel="stylesheet" href="../assets/css/role-based-styles.css">
    <link rel="stylesheet" href="../assets/css/icon-enhancements.css">
    <link rel="stylesheet" href="../assets/css/auth-enhancements.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page animated-gradient-bg">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>UiTM Book</h1>
                <h1>e-Marketplace</h1>
                <p>Login to your account</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="userId">Student/Staff ID</label>
                    <input type="text" id="userId" name="userId" required placeholder="Enter your ID">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="auth-links">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>

</html>
