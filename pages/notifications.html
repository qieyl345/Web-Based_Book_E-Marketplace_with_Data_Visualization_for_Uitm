<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - UiTM Book e-Marketplace</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    <link rel="stylesheet" href="../assets/css/notifications.css">
    <!-- UiTM Design System -->
    <link rel="stylesheet" href="../assets/css/uitm-glassmorphism.css">
    <link rel="stylesheet" href="../assets/css/uitm-animations.css">
    <link rel="stylesheet" href="../assets/css/role-based-styles.css">
    <link rel="stylesheet" href="../assets/css/icon-enhancements.css">
    <link rel="stylesheet" href="../assets/css/welcome-message.css">
    <link rel="stylesheet" href="../assets/css/header-balance.css">
    <link rel="stylesheet" href="../assets/css/ui-fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .notifications-page {
            padding: 2rem 0;
            min-height: calc(100vh - 80px);
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .notifications-header h1 {
            font-size: 2rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .notifications-header h1 i {
            color: #3b82f6;
        }

        .notifications-actions {
            display: flex;
            gap: 0.75rem;
        }

        .notifications-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .notifications-filters {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #3b82f6;
        }

        .filter-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .notification-full-list {
            max-height: 70vh;
            overflow-y: auto;
        }

        .notification-full-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
            cursor: pointer;
        }

        .notification-full-item:hover {
            background: #f8fafc;
        }

        .notification-full-item.unread {
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            border-left: 4px solid #3b82f6;
        }

        .notification-icon-large {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notification-icon-large i {
            font-size: 1.25rem;
            color: white;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }

        .notification-message {
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .notification-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .notification-time {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .notification-badge {
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-offer {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-transaction {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-warranty {
            background: #fef3c7;
            color: #b45309;
        }

        .badge-admin {
            background: #fee2e2;
            color: #b91c1c;
        }

        .notification-actions-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .notification-actions-btn button {
            padding: 0.5rem;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .notification-actions-btn button:hover {
            background: #f1f5f9;
            color: #3b82f6;
        }

        .empty-notifications {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-notifications i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            background: #dcfce7;
            color: #15803d;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .live-indicator .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1><i class="fas fa-book"></i> UiTM Book e-Marketplace</h1>
                </div>

                <nav class="main-nav">
                    <a href="../index.html" class="nav-link">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="cart.html" class="nav-link">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span id="cartCount" class="badge">0</span>
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user-circle"></i> Profile
                    </a>

                    <!-- Notification Bell -->
                    <div class="notification-wrapper">
                        <div class="notification-bell" id="notificationBell">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge" id="notificationBadge">0</span>
                        </div>
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-header">
                                <h3>Notifications</h3>
                                <button class="mark-read-btn" onclick="markAllAsRead()">Mark all as read</button>
                            </div>
                            <div class="notification-list" id="notificationList">
                                <!-- Notifications will be loaded here -->
                            </div>
                        </div>
                    </div>

                    <div id="userNav">
                        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="notifications-page">
        <div class="container">
            <div class="notifications-header">
                <h1><i class="fas fa-bell"></i> Notifications</h1>
                <div class="notifications-actions">
                    <span class="live-indicator">
                        <span class="live-dot"></span>
                        Live Updates
                    </span>
                    <button class="btn btn-secondary" onclick="markAllNotificationsRead()">
                        <i class="fas fa-check-double"></i> Mark All Read
                    </button>
                </div>
            </div>

            <div class="notifications-container">
                <div class="notifications-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="unread">Unread</button>
                    <button class="filter-btn" data-filter="offers">Offers</button>
                    <button class="filter-btn" data-filter="transactions">Transactions</button>
                    <button class="filter-btn" data-filter="warranty">Warranty</button>
                </div>

                <div class="notification-full-list" id="notificationFullList">
                    <div class="empty-notifications">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading notifications...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/notification-history.js"></script>
</body>

</html>
